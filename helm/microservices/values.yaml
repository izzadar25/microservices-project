frontend:
  image:
    repository: frontend-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    path: /health
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

backend:
  image:
    repository: backend-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    path: /health
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

config:
  appVersion: "1.0.0"
  logLevel: "info"
  backendHost: "backend"
  backendPort: "5000"

secrets:
  apiKey: "demo-api-key-change-me"
  dbPassword: "demo-password-change-me"
